# Grants the Backstage service account read-only visibility into workloads
# across the cluster. The Kubernetes plugin needs this to render live status
# on entity pages. Read verbs only — Backstage never mutates the cluster.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-kubernetes-reader
  labels:
    app: {{ .Release.Name }}
rules:
  - apiGroups: ['']
    resources:
      - pods
      - services
      - configmaps
      - limitranges
      - resourcequotas
    verbs: ['get', 'list', 'watch']
  - apiGroups: ['']
    resources:
      - pods/log
    verbs: ['get', 'list']
  - apiGroups: ['apps']
    resources:
      - deployments
      - replicasets
      - statefulsets
      - daemonsets
    verbs: ['get', 'list', 'watch']
  - apiGroups: ['batch']
    resources:
      - jobs
      - cronjobs
    verbs: ['get', 'list', 'watch']
  - apiGroups: ['autoscaling']
    resources:
      - horizontalpodautoscalers
    verbs: ['get', 'list', 'watch']
  - apiGroups: ['networking.k8s.io']
    resources:
      - ingresses
    verbs: ['get', 'list', 'watch']
  - apiGroups: ['metrics.k8s.io']
    resources:
      - pods
    verbs: ['get', 'list']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-kubernetes-reader
  labels:
    app: {{ .Release.Name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-kubernetes-reader
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccount.name }}
    namespace: {{ .Release.Namespace }}