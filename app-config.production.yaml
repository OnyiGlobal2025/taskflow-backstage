app:
  # Should be the same as backend.baseUrl when using the `app-backend` plugin.
  baseUrl: http://localhost:7007

backend:
  # Note that the baseUrl should be the URL that the browser and other clients
  # should use when communicating with the backend, i.e. it needs to be
  # reachable not just from within the backend host, but from all of your
  # callers. When its value is "http://localhost:7007", it's strictly private
  # and can't be reached by others.
  baseUrl: http://localhost:7007
  # The listener can also be expressed as a single <host>:<port> string. In this case we bind to
  # all interfaces, the most permissive setting. The right value depends on your specific deployment.
  listen: ':7007'

  # config options: https://node-postgres.com/apis/client
  database:
    client: pg
    connection:
      host: ${POSTGRES_HOST}
      port: ${POSTGRES_PORT}
      user: ${POSTGRES_USER}
      password: ${POSTGRES_PASSWORD}
      ssl:
        ca:
          $file: /etc/ssl/rds/rds-ca-us-east-1.pem

catalog:
  locations:
    - type: url
      target: https://github.com/OnyiGlobal2025/taskflow-app/blob/main/catalog-info.yaml
    - type: url
      target: https://github.com/OnyiGlobal2025/taskflow-backstage/blob/main/catalog-info.yaml
    - type: url
      target: https://github.com/OnyiGlobal2025/taskflow-gitops/blob/main/catalog-info.yaml
    - type: url
      target: https://github.com/OnyiGlobal2025/taskflow-infra/blob/main/catalog-info.yaml
    - type: url
      target: https://github.com/OnyiGlobal2025/taskflow-backstage/blob/main/catalog-org.yaml
      rules:
        - allow: [User, Group]
    - type: url
      target: https://github.com/OnyiGlobal2025/taskflow-backstage/blob/main/scaffolder-templates/service/template.yaml
      rules:
        - allow: [Template]

techdocs:
  # 'external' means Backstage never builds docs itself — CI does, and
  # Backstage only serves the pre-built HTML. No Python/MkDocs in the image.
  builder: 'external'
  publisher:
    type: 'awsS3'
    awsS3:
      bucketName: ${TECHDOCS_S3_BUCKET_NAME}
      region: ${AWS_REGION}
      # No credentials block — the AWS SDK picks up the IRSA web identity
      # token projected into the pod by the annotated service account.

kubernetes:
  serviceLocatorMethod:
    type: 'multiTenant'
  clusterLocatorMethods:
    - type: 'config'
      clusters:
        - name: taskflow-eks-cluster
          # The in-cluster API server address. Backstage watches the cluster
          # it is deployed into, using the service account token and CA that
          # Kubernetes projects into every pod.
          url: https://kubernetes.default.svc
          authProvider: 'serviceAccount'
          serviceAccountToken:
            $file: /var/run/secrets/kubernetes.io/serviceaccount/token
          caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          skipTLSVerify: false

proxy:
  endpoints:
    # The ArgoCD frontend plugin calls Backstage at /api/proxy/argocd/api,
    # which forwards to argocd-server over the cluster network. ArgoCD runs
    # with server.insecure=true, so this is plain HTTP inside the cluster.
    '/argocd/api':
      target: http://argocd-server.argocd.svc.cluster.local
      changeOrigin: true
      headers:
        Cookie: argocd.token=${ARGOCD_AUTH_TOKEN}