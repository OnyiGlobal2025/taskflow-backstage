site_name: ${{ values.name }}
site_description: ${{ values.description }}

repo_url: https://github.com/${{ values.destination.owner }}/${{ values.destination.repo }}
edit_uri: edit/main/docs/

nav:
  - Home: index.md

plugins:
  - techdocs-core

# No pymdownx custom_fences — the !!python/name: YAML tag is rejected by
# techdocs-cli's strict loader. Mermaid renders client-side in Backstage.