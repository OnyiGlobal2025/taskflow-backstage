name: CI Pipeline

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read
  security-events: write

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: 713923090919.dkr.ecr.us-east-1.amazonaws.com/${{ values.name }}
  AWS_ROLE_ARN: arn:aws:iam::713923090919:role/taskflow-github-actions-role

jobs:
  lint-and-test:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test --if-present

  sast-scan:
    name: SAST scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: p/nodejs p/secrets
        continue-on-error: true

  build-and-push:
    name: Build, scan and push image
    runs-on: ubuntu-latest
    needs: [lint-and-test, sast-scan]
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${% raw %}{{ env.AWS_ROLE_ARN }}{% endraw %}
          aws-region: ${% raw %}{{ env.AWS_REGION }}{% endraw %}
          role-session-name: github-actions-${{ values.name }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names ${{ values.name }} --region $AWS_REGION 2>/dev/null \
            || aws ecr create-repository \
                 --repository-name ${{ values.name }} \
                 --region $AWS_REGION \
                 --image-scanning-configuration scanOnPush=true  

      - name: Build image
        run: |
          docker build \
            -t $ECR_REPOSITORY:${% raw %}{{ github.sha }}{% endraw %} \
            -t $ECR_REPOSITORY:latest \
            .

      - name: Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${% raw %}{{ env.ECR_REPOSITORY }}{% endraw %}:${% raw %}{{ github.sha }}{% endraw %}"
          format: "sarif"
          output: "trivy.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "0"

      - name: Push image
        run: |
          docker push $ECR_REPOSITORY:${% raw %}{{ github.sha }}{% endraw %}
          docker push $ECR_REPOSITORY:latest

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy.sarif
          category: trivy
        continue-on-error: true