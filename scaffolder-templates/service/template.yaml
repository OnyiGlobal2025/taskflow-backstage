apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: taskflow-service
  title: TaskFlow Service (Golden Path)
  description: |
    Scaffold a production-ready Node.js service, pre-wired with the TaskFlow
    platform conventions — multi-stage Docker build, Helm chart, CI with SAST
    and image scanning over OIDC, ArgoCD delivery, catalog registration, and
    TechDocs. Everything that normally takes a week of setup, in ninety seconds.
  tags:
    - nodejs
    - golden-path
    - recommended
spec:
  owner: platform-team
  type: service

  parameters:
    - title: Service details
      required:
        - name
        - description
      properties:
        name:
          title: Service name
          type: string
          description: Lowercase, hyphen-separated. Used for the repo, image, and catalog entry.
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          ui:autofocus: true
          ui:help: 'e.g. payments-api, user-service'
        description:
          title: Description
          type: string
          description: One line on what this service does.

    - title: Ownership
      required:
        - owner
        - lifecycle
      properties:
        owner:
          title: Owner
          type: string
          description: The team or user that owns this service.
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: [Group, User]
        lifecycle:
          title: Lifecycle
          type: string
          description: Maturity of this service.
          default: experimental
          enum:
            - experimental
            - production
            - deprecated

    - title: Repository
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Repository location
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com
            allowedOwners:
              - OnyiGlobal2025

  steps:
    - id: fetch
      name: Render the skeleton
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          lifecycle: ${{ parameters.lifecycle }}
          destination: ${{ parameters.repoUrl | parseRepoUrl }}

    - id: publish
      name: Create the GitHub repository
      action: publish:github
      input:
        repoUrl: ${{ parameters.repoUrl }}
        description: ${{ parameters.description }}
        defaultBranch: main
        repoVisibility: public

    - id: register
      name: Register in the catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml

  output:
    links:
      - title: View the repository
        url: ${{ steps.publish.output.remoteUrl }}
      - title: Open in the catalog
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}